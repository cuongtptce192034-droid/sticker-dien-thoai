<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tương Tác Cảm Xúc - Cường The Star</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        /* Thêm hiệu ứng loading cho chuyên nghiệp */
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; color: #00ffcc; display: flex;
            justify-content: center; align-items: center; z-index: 999;
            font-family: sans-serif; font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="loading">ĐANG KHỞI TẠO CAMERA AR...</div>

    <a-scene mindar-image="imageTargetSrc: ./girl.mind; filterMinCF: 0.0001; filterBeta: 0.001;" 
             color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"
             cursor="rayOrigin: mouse" raycaster="objects: .clickable">
      
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-image id="ar-character" class="clickable" src="./Girlpho/frame_0_delay-0.08s.gif" position="0 0 0" height="1" width="1"></a-image>
        
        <a-text id="emotion-pop" value="" position="0 0.6 0" scale="0 0 0" align="center" color="#deff9a" font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"></a-text>
      </a-entity>
    </a-scene>

    <script>
        const loading = document.querySelector('#loading');
        const character = document.querySelector('#ar-character');
        const emotionPop = document.querySelector('#emotion-pop');

        // 1. Vòng lặp 8 ảnh tuần hoàn gốc
        let currentFrame = 0;
        setInterval(() => {
            currentFrame = (currentFrame + 1) % 8;
            character.setAttribute('src', `./Girlpho/frame_${currentFrame}_delay-0.08s.gif`);
        }, 80);

        // 2. Ẩn màn hình loading khi bắt đầu quét được target
        document.querySelector('a-scene').addEventListener("arReady", () => { loading.style.display = 'none'; });

        // 3. Xử lý hiệu ứng bay icon khi click
        const icons = ["😄 CUOI", "😭 KHOC", "❤️ THICH"];
        let iconIdx = 0;
        let active = false;

        character.addEventListener('click', () => {
            if (active) return;
            active = true;

            // Thiết lập nội dung và vị trí ban đầu
            emotionPop.setAttribute('value', icons[iconIdx]);
            iconIdx = (iconIdx + 1) % icons.length;
            emotionPop.setAttribute('scale', '1.2 1.2 1.2');
            let posY = 0.6;
            emotionPop.setAttribute('position', `0 ${posY} 0`);

            // Animation bay lên
            let fly = setInterval(() => {
                posY += 0.02;
                emotionPop.setAttribute('position', `0 ${posY} 0`);
                
                let scale = emotionPop.getAttribute('scale').x;
                if (scale > 0) {
                    scale -= 0.03;
                    emotionPop.setAttribute('scale', `${scale} ${scale} ${scale}`);
                }

                if (posY >= 1.3) {
                    clearInterval(fly);
                    emotionPop.setAttribute('scale', '0 0 0');
                    active = false;
                }
            }, 20);
        });
    </script>
</body>
</html>

Dự án AR của Cường The Star giờ đây đã lên một tầm cao mới với hệ thống 3 file chuyên biệt. Bạn hãy upload lên GitHub và tận hưởng thành quả nhé!
