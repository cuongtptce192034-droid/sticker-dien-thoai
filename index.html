<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cường Droid - Trải nghiệm AR & Liên hệ</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
        
        /* NHÚNG CAMERA AR CHẠY TOÀN MÀN HÌNH LÀM NỀN */
        .ar-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
        }

        /* ĐÈ KHUNG LIÊN HỆ LÊN TRÊN CAMERA AR */
        .overlay-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            pointer-events: none; /* Để không che mất cảm ứng quét của camera */
        }
        
        .profile-card {
            background: rgba(118, 75, 162, 0.35); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 25px;
            border-radius: 24px 24px 0 0;
            width: 100%;
            max-width: 400px;
            text-align: center;
            color: white;
            box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            pointer-events: auto; /* Kích hoạt lại để click được nút bấm */
        }

        .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid #00ffcc;
            object-fit: cover;
            margin-bottom: 8px;
        }

        h1 { margin: 0 0 5px 0; font-size: 20px; color: #00ffcc; font-weight: bold; }
        p { margin: 0 0 15px 0; font-size: 13px; opacity: 0.9; }

        .btn-social {
            display: block;
            text-decoration: none;
            padding: 12px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
            background: linear-gradient(45deg, #00ffcc, #0099ff);
            color: #121212;
            border: none;
        }
        .btn-social:hover { 
            background: linear-gradient(45deg, #0099ff, #00ffcc);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <iframe src="./quet-ar.html" class="ar-background" allow="camera"></iframe>

    <div class="overlay-content">
        <div class="profile-card">
            <img class="avatar" src="./Girlpho/frame_0_delay-0.08s.gif" alt="Avatar">
            <h1>Cường Droid</h1>
            <p>Hãy hướng camera vào sticker để quét AR và kết nối cùng tôi nhé!</p>
            
            <a href="https://www.szactrl.com/" target="_blank" class="btn-social">🌐 Ghé thăm SZACTRL.com</a>
        </div>
    </div>

</body>
</html>
